version: 2

project_name: docker-dns-sync

builds:
  - id: docker-dns-sync
    main: ./cmd/docker-dns-sync
    binary: docker-dns-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release-archives
    ids:
      - docker-dns-sync
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

dockers_v2:
  - id: release-container
    ids:
      - docker-dns-sync
    dockerfile: Dockerfile.release
    images:
      - "ghcr.io/aaronflorey/docker-dns-sync"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"

homebrew_casks:
  - name: docker-dns-sync
    ids:
      - release-archives
    binaries:
      - docker-dns-sync
    repository:
      owner: aaronflorey
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url:
      verified: "github.com/aaronflorey/docker-dns-sync/"
    homepage: https://github.com/aaronflorey/docker-dns-sync
    description: Sync Godoxy-labeled Docker workloads into AdGuard Home rewrites
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/docker-dns-sync"]
          end

checksum:
  name_template: checksums.txt

changelog:
  disable: true
