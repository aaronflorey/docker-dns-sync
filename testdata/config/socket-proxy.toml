[[sources]]
type = "docker"
name = "socket-proxy"
# Docker reachable through a TCP socket proxy or remote daemon.
endpoint = "tcp://docker-socket-proxy:2375"

[[outputs]]
type = "adguard"
name = "primary-adguard"
# Replace with the network-reachable AdGuard URL for your container or remote setup.
url = "http://adguardhome:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

[state]
path = "/var/lib/docker-dns-sync/state.json"

[logging]
level = "info"
format = "json"

[retry]
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
