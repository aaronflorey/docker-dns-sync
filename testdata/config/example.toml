[[sources]]
type = "docker"
name = "local-docker"
# Host-oriented local Docker socket example. For container deployment, start from
# testdata/config/docker-container.toml or testdata/config/socket-proxy.toml instead.
endpoint = "unix:///var/run/docker.sock"
# Set the host-reachable IP that derived DNS records should answer with.
host_ip = "192.168.1.50"

[[outputs]]
type = "adguard"
name = "primary-adguard"
# Host-binary example: AdGuard is reachable on the same machine.
url = "http://127.0.0.1:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

# Optional second output: enable Cloudflare sync for the same derived records.
#[[outputs]]
#type = "cloudflare"
#name = "primary-cloudflare"
#enabled = true
#zone_id = "your-zone-id"
#api_key_ref = "ENV:CLOUDFLARE_API_KEY"

[state]
# This path must stay writable by the deployed process.
path = "/var/lib/docker-dns-sync/state.json"

[logging]
level = "info"
format = "json"

[retry]
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
