[[sources]]
type = "docker"
name = "local-docker"
# Local Docker socket example. For proxy or remote Docker access, start from
# testdata/config/socket-proxy.toml instead.
endpoint = "unix:///var/run/docker.sock"

[[outputs]]
type = "adguard"
name = "primary-adguard"
url = "http://127.0.0.1:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

[state]
# This path must stay writable by the deployed process.
path = "/var/lib/docker-dns-sync/state.json"

[logging]
level = "info"
format = "json"

[retry]
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
